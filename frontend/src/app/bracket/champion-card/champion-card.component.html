@if (!closed()) {
  <div class="champion-overlay" role="dialog" aria-label="Tournament Champion">
    <div class="champion-aura" aria-hidden="true"></div>
    <div class="champion-stack">
      <div class="champion-title">CHAMPION</div>
      <div class="champion-frame">
        <button class="champion-close" type="button" aria-label="Fermer" (click)="close()">×</button>
        <div class="champion-card">
          <div class="champion-portrait">
            <img [src]="champion().fighterImageUrl" [alt]="champion().fighterName" />
          </div>
          <div class="champion-inner">
            <div class="champion-label">Iron Fist Tournament</div>
            <div class="champion-player">{{ champion().playerName }}</div>
            <div class="champion-fighter">{{ champion().fighterName }}</div>
            <div class="champion-sub">Grand Prix Winner</div>
          </div>
          <div class="champion-glare" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>
}
